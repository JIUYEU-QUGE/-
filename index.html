<!-- Generated by Trae Work -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="课堂反馈">
<meta name="theme-color" content="#6d4aff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>课堂反馈生成器</title>
<style>
  :root{
    --bg:#f7f8fa;
    --surface:#ffffff;
    --surface-2:#f0f2f5;
    --border:#e5e7eb;
    --text:#1f2937;
    --text-sub:#6b7280;
    --text-light:#9ca3af;
    --brand:#6d4aff;
    --brand-soft:#f0ecff;
    --brand-dark:#5a3ae0;
    --success:#16a34a;
    --danger:#dc2626;
    --warning:#f59e0b;
    --radius:14px;
    --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.04);
    --shadow-md:0 4px 12px rgba(0,0,0,0.06);
    --shadow-lg:0 8px 24px rgba(109,74,255,0.15);
    --safe-top:env(safe-area-inset-top);
    --safe-bottom:env(safe-area-inset-bottom);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
    font-size:16px;
    -webkit-font-smoothing:antialiased;
    padding-top:var(--safe-top);
    padding-bottom:var(--safe-bottom);
  }

  /* App Container */
  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
    max-width:640px;
    margin:0 auto;
    position:relative;
  }

  /* Top Navigation */
  .top-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 16px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .top-nav h1{
    font-size:18px;
    font-weight:700;
    margin:0;
    background:linear-gradient(135deg,var(--brand),#8b5cf6);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .nav-actions{display:flex;gap:8px}
  .icon-btn{
    width:38px;height:38px;
    border:none;border-radius:50%;
    background:var(--surface-2);
    color:var(--text);
    font-size:18px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:.15s;
  }
  .icon-btn:active{transform:scale(0.95);background:var(--brand-soft);color:var(--brand)}

  /* Tab Bar */
  .tab-bar{
    display:flex;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    flex-shrink:0;
    padding:0 8px;
  }
  .tab-item{
    flex:1;
    padding:12px 8px;
    text-align:center;
    font-size:14px;
    font-weight:500;
    color:var(--text-sub);
    cursor:pointer;
    position:relative;
    transition:.15s;
    border:none;
    background:none;
    font-family:inherit;
  }
  .tab-item.active{color:var(--brand);font-weight:600}
  .tab-item.active::after{
    content:'';
    position:absolute;
    bottom:0;left:50%;
    transform:translateX(-50%);
    width:24px;height:3px;
    background:var(--brand);
    border-radius:3px 3px 0 0;
  }

  /* Pages */
  .pages{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
  .page{display:none;padding:16px;padding-bottom:calc(20px + var(--safe-bottom))}
  .page.active{display:block}

  /* Cards */
  .card{
    background:var(--surface);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
    box-shadow:var(--shadow-sm);
    border:1px solid var(--border);
  }
  .card-title{
    font-size:13px;
    font-weight:600;
    color:var(--text-sub);
    margin-bottom:12px;
    letter-spacing:.3px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  /* Form Elements */
  label{
    display:block;
    font-size:13px;
    color:var(--text-sub);
    margin-bottom:6px;
    font-weight:500;
  }
  input[type=text],input[type=password],input[type=date],textarea,select{
    width:100%;
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:10px 12px;
    font-size:15px;
    font-family:inherit;
    background:var(--surface);
    color:var(--text);
    transition:.15s;
    -webkit-appearance:none;
    appearance:none;
  }
  input:focus,textarea:focus,select:focus{
    outline:none;
    border-color:var(--brand);
    box-shadow:0 0 0 3px var(--brand-soft);
  }
  textarea{
    resize:none;
    min-height:140px;
    line-height:1.7;
    padding:12px;
  }
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>div{flex:1;min-width:120px}
  .field{margin-bottom:12px}
  .field:last-child{margin-bottom:0}
  .hint{font-size:12px;color:var(--text-light);margin-top:6px;line-height:1.5}
  .char-count{font-size:12px;color:var(--text-light);text-align:right;margin-top:4px}

  /* Buttons */
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    border:none;
    border-radius:var(--radius-sm);
    padding:12px 20px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
    transition:.15s;
    -webkit-appearance:none;
    appearance:none;
  }
  .btn:active{transform:scale(0.98)}
  .btn-primary{
    background:linear-gradient(135deg,var(--brand),#8b5cf6);
    color:#fff;
    width:100%;
    box-shadow:var(--shadow-lg);
  }
  .btn-primary:disabled{opacity:.6;cursor:not-allowed;box-shadow:none}
  .btn-secondary{
    background:var(--surface-2);
    color:var(--text);
  }
  .btn-secondary:active{background:var(--border)}
  .btn-outline{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text);
  }
  .btn-sm{padding:8px 14px;font-size:13px}
  .btn-warn{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
  .btn-danger{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}

  /* Status */
  .status-box{
    text-align:center;
    padding:12px;
    font-size:13px;
    border-radius:var(--radius-sm);
    margin-top:10px;
  }
  .status-box.err{background:#fef2f2;color:var(--danger)}
  .status-box.ok{background:#f0fdf4;color:var(--success)}
  .status-box.info{background:var(--brand-soft);color:var(--brand)}

  /* Spinner */
  .spinner{
    display:inline-block;
    width:18px;height:18px;
    border:2px solid rgba(255,255,255,.3);
    border-radius:50%;
    border-top-color:#fff;
    animation:spin .7s linear infinite;
    vertical-align:middle;
    margin-right:6px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Result Cards */
  .result-card{
    background:var(--surface);
    border-radius:var(--radius);
    margin-bottom:12px;
    border:1px solid var(--border);
    overflow:hidden;
    box-shadow:var(--shadow-sm);
  }
  .result-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 14px;
    background:var(--brand-soft);
    border-bottom:1px solid rgba(109,74,255,0.1);
  }
  .result-name{
    font-size:15px;
    font-weight:700;
    color:var(--brand);
  }
  .result-badge{
    font-size:11px;
    padding:2px 8px;
    background:rgba(109,74,255,0.15);
    color:var(--brand);
    border-radius:999px;
    font-weight:500;
  }
  .result-body{
    padding:14px;
    font-size:14px;
    line-height:1.75;
    white-space:pre-wrap;
    background:var(--bg);
    min-height:80px;
    max-height:300px;
    overflow-y:auto;
  }
  .result-body[contenteditable=true]:focus{
    outline:2px solid var(--brand);
    outline-offset:-2px;
    background:#fff;
  }
  .result-actions{
    display:flex;
    gap:8px;
    padding:10px 14px;
    border-top:1px solid var(--border);
    background:var(--surface);
  }
  .result-actions .btn{flex:1}

  /* Toolbar */
  .toolbar{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:12px;
    flex-wrap:wrap;
  }

  /* Empty State */
  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:var(--text-light);
  }
  .empty-icon{font-size:40px;margin-bottom:12px;opacity:.5}
  .empty-text{font-size:14px}

  /* History Items */
  .hist-item{
    display:flex;
    align-items:center;
    padding:12px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    transition:.1s;
  }
  .hist-item:last-child{border-bottom:none}
  .hist-item:active{background:var(--surface-2)}
  .hist-info{flex:1;min-width:0}
  .hist-title{font-size:14px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hist-meta{font-size:12px;color:var(--text-light)}
  .hist-delete{
    background:none;
    border:none;
    color:var(--danger);
    font-size:20px;
    cursor:pointer;
    padding:4px 8px;
    line-height:1;
    opacity:.6;
  }
  .hist-delete:active{opacity:1}

  /* Student List */
  .student-item{
    display:flex;
    align-items:center;
    padding:12px;
    border-bottom:1px solid var(--border);
  }
  .student-item:last-child{border-bottom:none}
  .student-avatar{
    width:40px;height:40px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--brand),#8b5cf6);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:600;
    font-size:15px;
    margin-right:12px;
    flex-shrink:0;
  }
  .student-info{flex:1;min-width:0}
  .student-name{font-size:15px;font-weight:600;margin-bottom:2px}
  .student-desc{font-size:12px;color:var(--text-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .student-count{
    font-size:11px;
    padding:2px 8px;
    background:var(--brand-soft);
    color:var(--brand);
    border-radius:999px;
    font-weight:500;
    flex-shrink:0;
  }

  /* Setting Rows */
  .setting-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid var(--border);
  }
  .setting-row:last-child{border-bottom:none}
  .setting-label{font-size:14px;font-weight:500}
  .setting-value{font-size:13px;color:var(--text-light);max-width:50%;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* Toast */
  .toast{
    position:fixed;
    bottom:calc(30px + var(--safe-bottom));
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:rgba(31,41,55,0.95);
    color:#fff;
    padding:10px 20px;
    border-radius:999px;
    font-size:13px;
    font-weight:500;
    opacity:0;
    transition:.25s cubic-bezier(.4,0,.2,1);
    pointer-events:none;
    z-index:999;
    backdrop-filter:blur(10px);
    box-shadow:0 4px 20px rgba(0,0,0,0.2);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* Modal */
  .modal-mask{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.4);
    z-index:100;
    display:none;
    align-items:flex-end;
    justify-content:center;
    backdrop-filter:blur(4px);
  }
  .modal-mask.show{display:flex}
  .modal{
    background:var(--surface);
    border-radius:20px 20px 0 0;
    width:100%;
    max-width:640px;
    max-height:85vh;
    overflow-y:auto;
    padding:20px 16px;
    padding-bottom:calc(20px + var(--safe-bottom));
    animation:slideUp .25s ease-out;
  }
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .modal-handle{
    width:36px;height:4px;
    background:var(--border);
    border-radius:4px;
    margin:0 auto 16px;
  }
  .modal-title{
    font-size:17px;
    font-weight:700;
    margin-bottom:16px;
    text-align:center;
  }

  /* Key mask */
  .key-mask{font-size:12px;color:var(--success);margin-top:6px;min-height:18px}

  /* Chip tags */
  .chip{
    display:inline-block;
    padding:4px 10px;
    background:var(--brand-soft);
    color:var(--brand);
    font-size:12px;
    border-radius:999px;
    margin:2px 4px 2px 0;
    cursor:pointer;
    transition:.15s;
    border:none;
    font-family:inherit;
  }
  .chip:active{background:var(--brand);color:#fff}

  /* Quick add students */
  .quick-students{margin-top:8px}
  .quick-students .hint{margin-bottom:6px}

  /* Section header in page */
  .section-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .section-title{
    font-size:16px;
    font-weight:700;
    margin:0;
  }

  /* Feedback detail view */
  .detail-header{
    position:sticky;
    top:0;
    background:var(--bg);
    padding:8px 0 12px;
    z-index:10;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .back-btn{
    width:36px;height:36px;
    border:none;border-radius:50%;
    background:var(--surface);
    border:1px solid var(--border);
    font-size:18px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }

  /* Student detail feedback list */
  .feedback-entry{
    padding:12px 0;
    border-bottom:1px solid var(--border);
  }
  .feedback-entry:last-child{border-bottom:none}
  .feedback-date{font-size:12px;color:var(--text-light);margin-bottom:6px}
  .feedback-text{
    font-size:13px;
    color:var(--text);
    line-height:1.6;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  /* Install prompt */
  .install-banner{
    display:none;
    background:linear-gradient(135deg,var(--brand),#8b5cf6);
    color:#fff;
    padding:12px 16px;
    margin:12px;
    border-radius:var(--radius);
    font-size:13px;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    box-shadow:var(--shadow-lg);
  }
  .install-banner.show{display:flex}
  .install-text{flex:1}
  .install-text strong{display:block;margin-bottom:2px}
  .install-btn{
    background:rgba(255,255,255,0.25);
    color:#fff;
    border:1px solid rgba(255,255,255,0.3);
    padding:6px 14px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    backdrop-filter:blur(10px);
  }
  .install-close{
    background:none;
    border:none;
    color:#fff;
    font-size:18px;
    cursor:pointer;
    padding:0 4px;
    opacity:.8;
  }

  @media (min-width:640px){
    body{padding:0}
    .app{border-left:1px solid var(--border);border-right:1px solid var(--border)}
  }
</style>
</head>
<body>
<div class="app">
  <!-- Top Nav -->
  <div class="top-nav">
    <h1>📝 课堂反馈</h1>
    <div class="nav-actions">
      <button class="icon-btn" id="settingsBtn" title="设置">⚙️</button>
    </div>
  </div>

  <!-- Install Banner -->
  <div class="install-banner" id="installBanner">
    <div class="install-text">
      <strong>添加到主屏幕</strong>
      <span>像 App 一样使用，更方便</span>
    </div>
    <button class="install-btn" id="installBtn">添加</button>
    <button class="install-close" id="installClose">×</button>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <button class="tab-item active" data-tab="generate">✏️ 写反馈</button>
    <button class="tab-item" data-tab="history">📋 历史</button>
    <button class="tab-item" data-tab="students">👥 学生</button>
  </div>

  <!-- Pages -->
  <div class="pages">
    <!-- Generate Page -->
    <div class="page active" id="page-generate">
      <!-- 课堂信息 -->
      <div class="card">
        <div class="card-title">课堂信息</div>
        <div class="row">
          <div class="field">
            <label>日期</label>
            <input type="date" id="date">
          </div>
          <div class="field">
            <label>学科</label>
            <input type="text" id="subject" placeholder="数学" value="数学">
          </div>
        </div>
        <div class="field">
          <label>课堂知识点 <span style="color:var(--text-light);font-weight:400">（选填，留空自动提取）</span></label>
          <input type="text" id="topic" placeholder="如：万以上数的认识（读法、写法、组数）">
        </div>
        <div class="row">
          <div class="field">
            <label>抬头表情</label>
            <input type="text" id="emojiTop" placeholder="[玫瑰]" value="[玫瑰]">
          </div>
          <div class="field">
            <label>称呼方式</label>
            <select id="greetingStyle">
              <option value="name">直接用姓名</option>
              <option value="parent">XX家长您好</option>
              <option value="mom">XX妈妈您好</option>
              <option value="dad">XX爸爸您好</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 课堂笔记 -->
      <div class="card">
        <div class="card-title">
          <span>课堂笔记</span>
          <span style="color:var(--brand);font-size:12px;font-weight:500;cursor:pointer" id="toggleExample">📌 示例</span>
        </div>
        <label>整堂课情况（可含多个学生，也可一对一）</label>
        <textarea id="notes" placeholder="按「姓名：表现」的方式说/写，也可以整段自然描述，AI 会自动识别每个学生。&#10;&#10;例如：&#10;今天讲万以上数的认识。子芸状态很好，读法和组数都没问题，写法遇到中间有0的时候容易写错，讲完之后能改正过来。小明上课有点走神，读法基本会，组数还不熟练，需要多练习。"></textarea>
        <div class="char-count"><span id="noteCount">0</span> 字</div>
        <div class="quick-students" id="quickStudents">
          <div class="hint">快速插入学生：</div>
          <div id="studentChips"></div>
        </div>
        <button class="btn btn-primary" id="genBtn" style="margin-top:12px">
          ✨ 生成课堂反馈
        </button>
        <div class="status-box" id="status" style="display:none"></div>
      </div>

      <!-- 结果区 -->
      <div id="results"></div>
    </div>

    <!-- History Page -->
    <div class="page" id="page-history">
      <div class="section-header">
        <h2 class="section-title">历史记录</h2>
        <span style="font-size:12px;color:var(--text-light)" id="histCount">0 条</span>
      </div>
      <div class="card" style="padding:0">
        <div id="histList">
          <div class="empty-state">
            <div class="empty-icon">📭</div>
            <div class="empty-text">还没有历史记录</div>
            <div class="empty-text" style="font-size:12px;margin-top:4px">生成的反馈会自动保存在这里</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Students Page -->
    <div class="page" id="page-students">
      <div class="section-header">
        <h2 class="section-title">学生档案</h2>
        <button class="btn btn-sm btn-secondary" id="addStudentBtn">+ 添加</button>
      </div>
      <div class="card" style="padding:0">
        <div id="studentList">
          <div class="empty-state">
            <div class="empty-icon">👥</div>
            <div class="empty-text">还没有添加学生</div>
            <div class="empty-text" style="font-size:12px;margin-top:4px">添加后可快速插入，还能查看历史反馈</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Student Detail Page -->
    <div class="page" id="page-student-detail">
      <div class="detail-header">
        <button class="back-btn" id="backFromStudent">←</button>
        <div style="flex:1">
          <div id="detailStudentName" style="font-size:16px;font-weight:700"></div>
          <div style="font-size:12px;color:var(--text-light)" id="detailStudentCount"></div>
        </div>
      </div>
      <div class="card" style="padding:0" id="studentFeedbackList">
      </div>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-mask" id="settingsModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">⚙️ 设置</div>
    
    <div class="card">
      <div class="card-title">API 配置</div>

        <div class="field">

        <div class="field">
          <label>模型</label>
          <input type="text" id="model" placeholder="deepseek-chat">
        </div>

      <div class="card-title">反馈设置</div>
      <div class="field">
        <label>默认学科</label>
        <input type="text" id="defaultSubject" placeholder="数学">
      </div>
      <div class="field">
        <label>反馈字数</label>
        <select id="feedbackLength">
          <option value="short">简短（80-120字）</option>
          <option value="medium" selected>适中（120-200字）</option>
          <option value="long">详细（200-300字）</option>
        </select>
      </div>
      <div class="field">
        <label>语气风格</label>
        <select id="toneStyle">
          <option value="professional">专业严谨</option>
          <option value="warm" selected>亲切温暖</option>
          <option value="concise">简洁直接</option>
        </select>
      </div>

    <div class="card">
      <div class="card-title">数据管理</div>
      <button class="btn btn-outline" id="exportBtn" style="width:100%;margin-bottom:8px">📤 导出数据</button>
      <button class="btn btn-outline" id="importBtn" style="width:100%;margin-bottom:8px">📥 导入数据</button>
      <button class="btn btn-danger" id="clearBtn" style="width:100%">🗑️ 清空所有数据</button>
      <input type="file" id="importFile" accept=".json" style="display:none">
    </div>

    <div style="text-align:center;font-size:12px;color:var(--text-light);margin-top:16px">
      课堂反馈生成器 v1.0
    </div>
  </div>
</div>

<!-- Add Student Modal -->
<div class="modal-mask" id="addStudentModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">添加学生</div>
    <div class="card">
      <div class="field">
        <label>学生姓名</label>
        <input type="text" id="newStudentName" placeholder="请输入学生姓名">
      </div>
      <div class="field">
        <label>备注（选填）</label>
        <input type="text" id="newStudentNote" placeholder="如：三年级、一对一 等">
      </div>
      <button class="btn btn-primary" id="saveStudentBtn">保存</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ===================== 配置常量 =====================
const STORAGE_PREFIX = 'cfb_';
const HISTORY_MAX = 50;
const TIMEOUT_MS = 60000;
const MIN_NOTES_LEN = 8;

// ===================== 工具函数 =====================
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function load(key, def) {
  try {
    const v = localStorage.getItem(STORAGE_PREFIX + key);
    return v ? JSON.parse(v) : def;
  } catch(e) { return def; }
}
function save(key, val) {
  try { localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(val)); } catch(e) {}
}

function fmtDate(d) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '年' + p(d.getMonth()+1) + '月' + p(d.getDate()) + '日';
}

function toast(msg, duration = 1800) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), duration);
}

function showStatus(msg, type) {
  const s = $('status');
  if (!msg) { s.style.display = 'none'; return; }
  s.style.display = 'block';
  s.className = 'status-box ' + (type || '');
  s.textContent = msg;
}

// ===================== 提示词 =====================
function buildSystemPrompt() {
  const length = load('feedbackLength', 'medium');
  const tone = load('toneStyle', 'warm');
  
  let lengthDesc = '120-200字';
  if (length === 'short') lengthDesc = '80-120字';
  if (length === 'long') lengthDesc = '200-300字';

  let toneDesc = '亲切温暖，像老师和家长聊天一样自然';
  if (tone === 'professional') toneDesc = '专业严谨，体现教学专业性';
  if (tone === 'concise') toneDesc = '简洁直接，重点突出';

  return `你是一位经验丰富的机构数学老师助手，专门帮老师撰写高质量的课堂反馈。

【任务】
把老师提供的课堂简记，扩写成专业、具体、有温度的课堂反馈，发送给家长。

【每个学生反馈格式】
生成一段可直接复制发送的完整文本，结构如下：
第1行：{日期}{学科}课堂反馈{抬头表情}
第2行：{姓名}
第3行起：正文（两段，约${lengthDesc}），内容依次包含：
  第一段：课堂整体表现 + 掌握好的知识点（亮点）+ 具体例子
  第二段：需要改进的地方 + 具体错误案例 + 学习建议

【写作要求】
1. **语气**：${toneDesc}，直接称呼学生名字，不用"该生""同学""孩子"等套话。
2. **具体**：必须结合老师笔记中的具体内容，禁止空泛表扬。要提到具体的知识点。
3. **真实**：只基于老师提供的笔记内容，**绝对不编造**笔记里没有的信息。如果笔记里没有提到某个方面，就不写。
4. **专业**：涉及数学知识点时，要体现专业性，说清楚重难点和方法。
5. **积极**：即使学生有不足，也要用积极、鼓励的语气表达，先说优点再说改进点。
6. **禁忌**：绝对禁止使用"差""笨""差劲儿""不好"等负面词汇。用"需要加强""还可以提升""有待熟练"等积极表达。
7. **结尾**：以学习建议自然收尾，不要加"继续保持""加油""很棒"等套话，也不加结尾表情。
8. **多学生时**：每个学生的反馈要根据其实际表现区分，禁止雷同。

【输出格式】
严格只输出JSON，不要输出任何解释、markdown或额外文字。格式：
{"topic":"本节课知识点简短描述","students":[{"name":"学生姓名","feedback":"完整反馈文本（含抬头行+姓名行+正文，可直接复制发送）"}]}`;
}

function buildUserPrompt() {
  const dateVal = $('date').value;
  const dateStr = dateVal ? fmtDate(new Date(dateVal)) : fmtDate(new Date());
  const subject = $('subject').value.trim() || '数学';
  const topic = $('topic').value.trim();
  const emoji = $('emojiTop').value.trim() || '';
  const greeting = $('greetingStyle').value;
  const notes = $('notes').value.trim();
  const students = load('students', []);
  const roster = students.map(s => s.name).filter(Boolean).join('、');

  let p = `【日期】${dateStr}\n`;
  p += `【学科】${subject}\n`;
  p += `【抬头表情】${emoji || '无'}\n`;
  p += `【称呼方式】${greeting}\n`;
  p += topic ? `【知识点（已指定）】${topic}\n` : `【知识点】未指定，请从笔记中提取\n`;
  p += roster ? `【学生名单】${roster}\n请优先按名单在笔记中匹配识别学生。\n` : `【学生名单】未提供，请从笔记中智能识别人名。\n`;
  p += `\n【课堂笔记】\n${notes}\n\n`;
  p += `请识别笔记中涉及的每个学生（一对一就一个），为每人单独生成一份完整反馈。`;
  
  return p;
}

// ===================== API 调用 =====================
async function generateFeedback() {
  const key = $('apiKey')?.value?.trim() || load('apiKey', '');
  if (!key) {
    toast('请先在设置中填写 API Key');
    openSettings();
    return;
  }
  
  const notes = $('notes').value.trim();
  if (!notes) { toast('请先填写课堂笔记'); return; }
  if (notes.length < MIN_NOTES_LEN) { toast(`笔记内容过少（不足${MIN_NOTES_LEN}字）`); return; }

  const btn = $('genBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>生成中，请稍候…';
  showStatus('');
  $('results').innerHTML = '';

  const base = load('apiBase', 'https://api.deepseek.com').replace(/\/$/, '');
  const model = load('model', 'deepseek-chat');

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), TIMEOUT_MS);

  try {
    const resp = await fetch(base + '/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({
        model: model,
        messages: [
          { role: 'system', content: buildSystemPrompt() },
          { role: 'user', content: buildUserPrompt() }
        ],
        temperature: 0.7,
        response_format: { type: 'json_object' }
      }),
      signal: controller.signal
    });
    clearTimeout(timeoutId);

    if (!resp.ok) {
      const msg = friendlyError(resp.status);
      const t = await resp.text().catch(() => '');
      showStatus(msg + (t ? '：' + t.slice(0, 80) : ''), 'err');
      showRetry();
      return;
    }

    const data = await resp.json();
    const content = data.choices?.[0]?.message?.content || '';
    let obj;
    try { obj = JSON.parse(cleanJSON(content)); }
    catch(e) { showStatus('解析失败，AI 返回格式异常，请重试', 'err'); showRetry(); return; }
    
    renderResults(obj);
    saveHistory(obj);
    showStatus('已生成 ' + (obj.students?.length || 0) + ' 条反馈 ✨', 'ok');
    
    // 回填知识点
    if (!$('topic').value.trim() && obj.topic) {
      $('topic').value = obj.topic;
    }
  } catch(e) {
    clearTimeout(timeoutId);
    if (e.name === 'AbortError') {
      showStatus('请求超时，请检查网络后重试', 'err');
    } else {
      showStatus('请求失败：' + e.message, 'err');
    }
    showRetry();
  } finally {
    btn.disabled = false;
    btn.innerHTML = '✨ 生成课堂反馈';
  }
}

function cleanJSON(s) {
  s = s.trim();
  if (s.startsWith('```')) { s = s.replace(/^\`\`\`(?:json)?/i, '').replace(/\`\`\`$/, '').trim(); }
  return s;
}

function friendlyError(code) {
  if (code === 401) return 'API Key 无效或已过期';
  if (code === 403) return 'API Key 无访问权限';
  if (code === 429) return '请求过于频繁，请稍候再试';
  if (code >= 500) return '服务器内部错误（' + code + '）';
  return '接口错误（' + code + '）';
}

function showRetry() {
  const box = $('results');
  const div = document.createElement('div');
  div.className = 'card';
  div.style.textAlign = 'center';
  div.innerHTML = '<button class="btn btn-warn" id="retryBtn">🔄 重新生成</button>';
  box.insertBefore(div, box.firstChild);
  $('retryBtn').onclick = generateFeedback;
}

// ===================== 渲染结果 =====================
function renderResults(obj) {
  const box = $('results');
  const students = obj.students || [];
  
  if (!students.length) {
    box.innerHTML = '<div class="empty-state"><div class="empty-icon">🤔</div><div class="empty-text">未识别到学生</div><div class="empty-text" style="font-size:12px">请在笔记中补充学生姓名</div></div>';
    return;
  }

  let html = '';
  
  // 工具栏
  if (students.length > 1) {
    html += '<div class="toolbar"><button class="btn btn-sm btn-secondary" id="copyAllBtn">📋 复制全部</button></div>';
  }

  students.forEach((s, i) => {
    html += `
      <div class="result-card">
        <div class="result-header">
          <div class="result-name">${esc(s.name || ('学生' + (i+1)))}</div>
          <span class="result-badge">${i+1}/${students.length}</span>
        </div>
        <div class="result-body" contenteditable="true" spellcheck="false" data-index="${i}">${esc(s.feedback || '')}</div>
        <div class="result-actions">
          <button class="btn btn-sm btn-primary" data-action="copy" data-index="${i}">📋 复制</button>
          <button class="btn btn-sm btn-secondary" data-action="regenerate" data-index="${i}">🔄 重写</button>
        </div>
      </div>
    `;
  });

  box.innerHTML = html;

  // 绑定事件
  if (students.length > 1) {
    $('copyAllBtn').onclick = () => {
      const text = students.map(s => s.feedback || '').join('\n\n——————\n\n');
      copyText(text, '全部反馈');
    };
  }

  box.querySelectorAll('[data-action="copy"]').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.index);
      const body = box.querySelector(`.result-body[data-index="${idx}"]`);
      const name = students[idx]?.name || ('学生' + (idx+1));
      copyText(body.innerText, name);
    };
  });

  box.querySelectorAll('[data-action="regenerate"]').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.index);
      const name = students[idx]?.name;
      toast('单独重写功能开发中…');
    };
  });

  // 粘贴净化
  box.querySelectorAll('.result-body').forEach(body => {
    body.addEventListener('paste', e => {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text');
      document.execCommand('insertText', false, text);
    });
  });
}

async function copyText(text, label) {
  try {
    await navigator.clipboard.writeText(text);
    toast('已复制「' + label + '」✓');
  } catch(e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('已复制「' + label + '」✓'); }
    catch(_) { toast('复制失败，请手动选择'); }
    document.body.removeChild(ta);
  }
}

// ===================== 历史记录 =====================
function loadHistory() { return load('history', []); }

function saveHistory(obj) {
  const hist = loadHistory();
  const entry = {
    id: Date.now(),
    ts: Date.now(),
    date: $('date').value,
    subject: $('subject').value.trim() || '数学',
    topic: obj.topic || '',
    studentCount: obj.students?.length || 0,
    names: (obj.students || []).map(s => s.name).join('、'),
    data: obj
  };
  hist.unshift(entry);
  if (hist.length > HISTORY_MAX) hist.length = HISTORY_MAX;
  save('history', hist);
  renderHistory();
  
  // 更新学生档案中的反馈
  (obj.students || []).forEach(s => {
    addStudentFeedback(s.name, {
      id: Date.now() + Math.random(),
      date: $('date').value,
      topic: obj.topic || '',
      feedback: s.feedback,
      subject: $('subject').value.trim() || '数学'
    });
  });
  renderStudentList();
}

function renderHistory() {
  const hist = loadHistory();
  const box = $('histList');
  $('histCount').textContent = hist.length + ' 条';

  if (!hist.length) {
    box.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📭</div>
        <div class="empty-text">还没有历史记录</div>
        <div class="empty-text" style="font-size:12px;margin-top:4px">生成的反馈会自动保存在这里</div>
      </div>`;
    return;
  }

  let html = '';
  hist.forEach((h, idx) => {
    const dateStr = h.date ? fmtDate(new Date(h.date)) : '未知日期';
    const timeStr = new Date(h.ts).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    html += `
      <div class="hist-item" data-idx="${idx}">
        <div class="hist-info">
          <div class="hist-title">${esc(h.subject)} · ${esc(h.names)}</div>
          <div class="hist-meta">${esc(dateStr)} · ${h.studentCount}人 · ${timeStr}</div>
        </div>
        <button class="hist-delete" data-del="${idx}">×</button>
      </div>
    `;
  });
  box.innerHTML = html;

  // 点击恢复
  box.querySelectorAll('.hist-item').forEach(item => {
    item.querySelector('.hist-info').onclick = () => {
      const idx = parseInt(item.dataset.idx);
      const h = hist[idx];
      // 恢复到生成页
      if (h.date) $('date').value = h.date;
      if (h.subject) $('subject').value = h.subject;
      if (h.topic) $('topic').value = h.topic;
      renderResults(h.data);
      switchTab('generate');
      toast('已加载历史记录');
    };
  });

  // 删除
  box.querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.del);
      hist.splice(idx, 1);
      save('history', hist);
      renderHistory();
      toast('已删除');
    };
  });
}

// ===================== 学生管理 =====================
function getStudents() { return load('students', []); }

function addStudent(name, note) {
  const students = getStudents();
  if (students.some(s => s.name === name)) {
    toast('该学生已存在');
    return false;
  }
  students.push({
    id: Date.now(),
    name: name,
    note: note || '',
    feedbacks: [],
    createdAt: Date.now()
  });
  save('students', students);
  renderStudentList();
  renderStudentChips();
  return true;
}

function deleteStudent(id) {
  let students = getStudents();
  students = students.filter(s => s.id !== id);
  save('students', students);
  renderStudentList();
  renderStudentChips();
}

function addStudentFeedback(name, feedback) {
  const students = getStudents();
  const student = students.find(s => s.name === name);
  if (student) {
    if (!student.feedbacks) student.feedbacks = [];
    student.feedbacks.unshift(feedback);
    if (student.feedbacks.length > 100) student.feedbacks.length = 100;
    save('students', students);
  }
}

function renderStudentList() {
  const students = getStudents();
  const box = $('studentList');

  if (!students.length) {
    box.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">👥</div>
        <div class="empty-text">还没有添加学生</div>
        <div class="empty-text" style="font-size:12px;margin-top:4px">添加后可快速插入，还能查看历史反馈</div>
      </div>`;
    return;
  }

  let html = '';
  students.forEach(s => {
    const count = s.feedbacks?.length || 0;
    html += `
      <div class="student-item" data-id="${s.id}">
        <div class="student-avatar">${esc(s.name.slice(0, 1))}</div>
        <div class="student-info">
          <div class="student-name">${esc(s.name)}</div>
          <div class="student-desc">${esc(s.note || '暂无备注')}</div>
        </div>
        <div class="student-count">${count} 条</div>
      </div>
    `;
  });
  box.innerHTML = html;

  // 点击查看详情
  box.querySelectorAll('.student-item').forEach(item => {
    item.onclick = () => {
      const id = parseInt(item.dataset.id);
      const student = getStudents().find(s => s.id === id);
      if (student) showStudentDetail(student);
    };
  });
}

function renderStudentChips() {
  const students = getStudents();
  const box = $('studentChips');
  if (!students.length) {
    box.innerHTML = '<span style="font-size:12px;color:var(--text-light)">去「学生」页面添加</span>';
    return;
  }
  let html = '';
  students.forEach(s => {
    html += `<button class="chip" data-name="${esc(s.name)}">${esc(s.name)}</button>`;
  });
  box.innerHTML = html;

  box.querySelectorAll('.chip').forEach(chip => {
    chip.onclick = () => {
      const name = chip.dataset.name;
      const notes = $('notes');
      const text = notes.value;
      if (text && !text.endsWith('\n') && text.length > 0) {
        notes.value = text + '\n' + name + '：';
      } else {
        notes.value = text + name + '：';
      }
      notes.focus();
      updateNoteCount();
    };
  });
}

function showStudentDetail(student) {
  $('detailStudentName').textContent = student.name;
  const count = student.feedbacks?.length || 0;
  $('detailStudentCount').textContent = count + ' 条反馈记录';

  const list = $('studentFeedbackList');
  if (!count) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📝</div><div class="empty-text">还没有反馈记录</div></div>';
  } else {
    let html = '';
    student.feedbacks.forEach(f => {
      const dateStr = f.date ? fmtDate(new Date(f.date)) : '未知日期';
      html += `
        <div class="feedback-entry" style="padding:12px 16px;cursor:pointer">
          <div class="feedback-date">${esc(dateStr)} · ${esc(f.topic || f.subject || '')}</div>
          <div class="feedback-text">${esc(f.feedback || '')}</div>
        </div>
      `;
    });
    list.innerHTML = html;
  }

  switchTab('student-detail');
}

// ===================== Tab 切换 =====================
function switchTab(name) {
  document.querySelectorAll('.tab-item').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === name);
  });
  document.querySelectorAll('.page').forEach(p => {
    p.classList.toggle('active', p.id === 'page-' + name);
  });
  
  // 滚动到顶部
  const pages = document.querySelector('.pages');
  if (pages) pages.scrollTop = 0;
}

// ===================== 设置面板 =====================
function openSettings() {
  $('settingsModal').classList.add('show');
  // 填充当前值
  $('apiKey').value = load('apiKey', '');
  $('apiBase').value = load('apiBase', 'https://api.deepseek.com');
  $('model').value = load('model', 'deepseek-chat');
  $('defaultSubject').value = load('defaultSubject', '数学');
  $('feedbackLength').value = load('feedbackLength', 'medium');
  $('toneStyle').value = load('toneStyle', 'warm');
  updateKeyMask();
}

function closeSettings() {
  $('settingsModal').classList.remove('show');
}

function updateKeyMask() {
  const k = $('apiKey').value.trim();
  const m = $('keyMask');
  if (k.length >= 8) {
    m.textContent = '✓ 已保存：' + k.slice(0, 4) + '****' + k.slice(-4);
  } else if (k) {
    m.textContent = '已保存（Key 较短）';
  } else {
    m.textContent = '';
  }
}

// ===================== 数据导入导出 =====================
function exportData() {
  const data = {
    version: '1.0',
    exportedAt: new Date().toISOString(),
    students: load('students', []),
    history: load('history', []),
    settings: {
      apiBase: load('apiBase', 'https://api.deepseek.com'),
      model: load('model', 'deepseek-chat'),
      defaultSubject: load('defaultSubject', '数学'),
      feedbackLength: load('feedbackLength', 'medium'),
      toneStyle: load('toneStyle', 'warm'),
      emojiTop: load('emojiTop', '[玫瑰]'),
      greetingStyle: load('greetingStyle', 'name')
    }
  };
  
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '课堂反馈数据_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('已导出数据');
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.students) save('students', data.students);
      if (data.history) save('history', data.history);
      if (data.settings) {
        Object.entries(data.settings).forEach(([k, v]) => save(k, v));
      }
      initFromStorage();
      renderHistory();
      renderStudentList();
      renderStudentChips();
      toast('导入成功 ✓');
    } catch(err) {
      toast('导入失败：文件格式错误');
    }
  };
  reader.readAsText(file);
}

function clearAllData() {
  if (!confirm('确定要清空所有数据吗？此操作不可恢复！')) return;
  if (!confirm('再次确认：学生档案、历史记录、设置都将被清空！')) return;
  
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.startsWith(STORAGE_PREFIX)) keys.push(key);
  }
  keys.forEach(k => localStorage.removeItem(k));
  
  initFromStorage();
  renderHistory();
  renderStudentList();
  renderStudentChips();
  toast('已清空所有数据');
}

// ===================== 初始化 =====================
function initFromStorage() {
  // 日期默认今天
  $('date').value = new Date().toISOString().slice(0, 10);
  $('subject').value = load('defaultSubject', '数学');
  $('emojiTop').value = load('emojiTop', '[玫瑰]');
  $('greetingStyle').value = load('greetingStyle', 'name');
}

function updateNoteCount() {
  $('noteCount').textContent = $('notes').value.length;
}

// ===================== PWA 安装提示 =====================
let deferredPrompt = null;

function showInstallBanner() {
  if (load('installDismissed', false)) return;
  if (window.matchMedia('(display-mode: standalone)').matches) return; // 已经是 PWA 模式
  
  // 检测是否是 iOS
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const banner = $('installBanner');
  
  if (isIOS) {
    // iOS 不支持 beforeinstallprompt，手动提示
    setTimeout(() => {
      banner.classList.add('show');
    }, 3000);
  }
  
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    banner.classList.add('show');
  });
}

$('installBtn')?.addEventListener('click', async () => {
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  
  if (isIOS) {
    toast('请点击 Safari 分享按钮 → 添加到主屏幕', 3000);
  } else if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
      $('installBanner').classList.remove('show');
    }
    deferredPrompt = null;
  }
});

$('installClose')?.addEventListener('click', () => {
  $('installBanner').classList.remove('show');
  save('installDismissed', true);
});

// ===================== 事件绑定 =====================
document.addEventListener('DOMContentLoaded', () => {
  initFromStorage();
  renderHistory();
  renderStudentList();
  renderStudentChips();
  showInstallBanner();

  // Tab 切换
  document.querySelectorAll('.tab-item').forEach(tab => {
    tab.addEventListener('click', () => switchTab(tab.dataset.tab));
  });

  // 字数统计
  $('notes').addEventListener('input', updateNoteCount);

  // 生成按钮
  $('genBtn').addEventListener('click', generateFeedback);

  // 设置
  $('settingsBtn').addEventListener('click', openSettings);
  $('settingsModal').addEventListener('click', (e) => {
    if (e.target.id === 'settingsModal') closeSettings();
  });

  // 设置自动保存
  ['apiKey', 'apiBase', 'model', 'defaultSubject', 'feedbackLength', 'toneStyle'].forEach(id => {
    $(id).addEventListener('change', e => {
      save(id, e.target.value);
      if (id === 'apiKey') updateKeyMask();
    });
  });

  // 学科和表情自动保存
  $('subject').addEventListener('change', e => save('defaultSubject', e.target.value));
  $('emojiTop').addEventListener('change', e => save('emojiTop', e.target.value));
  $('greetingStyle').addEventListener('change', e => save('greetingStyle', e.target.value));

  // 示例切换
  $('toggleExample').addEventListener('click', () => {
    const notes = $('notes');
    if (notes.value) {
      if (confirm('会替换当前笔记内容，确定吗？')) {
        notes.value = '今天讲万以上数的认识。子芸状态很好，读法和组数都没问题，写法遇到中间有0的时候容易写错，讲完之后能改正过来。小明上课有点走神，读法基本会，组数还不熟练，需要多练习。';
        updateNoteCount();
      }
    } else {
      notes.value = '今天讲万以上数的认识。子芸状态很好，读法和组数都没问题，写法遇到中间有0的时候容易写错，讲完之后能改正过来。小明上课有点走神，读法基本会，组数还不熟练，需要多练习。';
      updateNoteCount();
    }
  });

  // 添加学生
  $('addStudentBtn').addEventListener('click', () => {
    $('newStudentName').value = '';
    $('newStudentNote').value = '';
    $('addStudentModal').classList.add('show');
  });
  $('addStudentModal').addEventListener('click', (e) => {
    if (e.target.id === 'addStudentModal') $('addStudentModal').classList.remove('show');
  });
  $('saveStudentBtn').addEventListener('click', () => {
    const name = $('newStudentName').value.trim();
    const note = $('newStudentNote').value.trim();
    if (!name) { toast('请输入学生姓名'); return; }
    if (addStudent(name, note)) {
      $('addStudentModal').classList.remove('show');
      toast('添加成功 ✓');
    }
  });

  // 学生详情返回
  $('backFromStudent').addEventListener('click', () => switchTab('students'));

  // 数据管理
  $('exportBtn').addEventListener('click', exportData);
  $('importBtn').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', (e) => {
    if (e.target.files[0]) importData(e.target.files[0]);
  });
  $('clearBtn').addEventListener('click', clearAllData);

  // 注册 Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
});
</script>
</body>
</html>
